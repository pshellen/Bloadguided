<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find Your Seats</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#152033;--muted:#60708a;--line:#d9e1ec;--blue:#1160d6;--route:#f5bd16;--purple:#a83eea;--seat:#fff;--selected:#1160d6;--selectedText:#fff;--danger:#b42318}
    @media(prefers-color-scheme:dark){:root{--bg:#0c111b;--panel:#151d2a;--text:#eef3fb;--muted:#a9b5c7;--line:#2a3850;--seat:#151d2a;--danger:#ff8b83}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(980px,100%);margin:0 auto;padding:28px 18px 48px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;text-align:center}p{color:var(--muted);text-align:center;margin:0 0 22px}
    form{display:flex;gap:10px;max-width:620px;margin:0 auto 24px}input,button{font:inherit;border-radius:12px}input{width:100%;padding:15px 16px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px}button{border:0;background:var(--blue);color:#fff;padding:0 22px;font-weight:700}button:focus,input:focus{outline:3px solid color-mix(in srgb,var(--blue) 30%,transparent);outline-offset:2px}
    #message{min-height:26px;text-align:center;color:var(--danger);font-weight:650}.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 26px rgb(20 35 60/.08)}
    .details{display:flex;gap:12px 24px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.title{font-size:clamp(22px,4vw,32px);font-weight:800}.meta{color:var(--muted);font-size:17px}.seats{font-size:clamp(24px,5vw,38px);font-weight:850;color:var(--blue)}
    .future-alert{margin:0 0 16px;padding:14px 16px;border-radius:12px;background:#fff2cc;color:#6b4d00;font-size:18px;font-weight:800;text-align:center;border:1px solid #f1ce62}.future-alert strong{display:block;font-size:21px}.future-alert span{display:block;margin-top:3px;font-size:15px;font-weight:650}
    .past-alert{margin:0 0 16px;padding:14px 16px;border-radius:12px;background:#fee4e2;color:#8f1d18;font-size:18px;font-weight:800;text-align:center;border:1px solid #f4aaa5}.past-alert strong{display:block;font-size:21px}.past-alert span{display:block;margin-top:3px;font-size:15px;font-weight:650}
    @media(prefers-color-scheme:dark){.future-alert{background:#3d3005;color:#ffe493;border-color:#715b12}}
    @media(prefers-color-scheme:dark){.past-alert{background:#481b19;color:#ffb4ae;border-color:#7c302c}}
    svg{width:100%;height:min(62vh,700px);display:block}.screen{fill:var(--line)}.screen-label{fill:var(--text);font-weight:800;font-size:18px}.trunk{fill:none;stroke:var(--purple);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.55}.branch{fill:none;stroke:var(--blue);stroke-width:7;stroke-linecap:round;opacity:.30}.route{fill:none;stroke:var(--route);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw-route 1.35s ease-out forwards}.seat{fill:var(--seat);stroke:var(--blue);stroke-width:2}.seat-label{fill:var(--text);font-size:12px;font-weight:700}.seat-group.selected .seat{fill:var(--selected);stroke:var(--selected)}.seat-group.selected .seat-label{fill:var(--selectedText)}.seat-group.access .seat{stroke-dasharray:4 3}.entry{fill:var(--purple)}.entry-label{fill:var(--text);font-size:12px;font-weight:800}
    @keyframes draw-route{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.route{animation:none;stroke-dashoffset:0}}
    .unsupported{padding:36px 18px;text-align:center;color:var(--muted);font-size:18px}@media(max-width:520px){form{flex-direction:column}button{padding:14px}.result{padding:12px}svg{height:min(58vh,560px)}}
  </style>
</head>
<body>
<main>
  <h1>Find Your Seats</h1>
  <p>Enter the order number from your confirmation.</p>
  <form id="lookup-form">
    <input id="order-number" inputmode="numeric" autocomplete="off" autofocus placeholder="Order number" aria-label="Order number">
    <button type="submit">Show seats</button>
  </form>
  <div id="message" role="alert" aria-live="polite"></div>
  <div id="results" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById('lookup-form'),input=document.getElementById('order-number'),message=document.getElementById('message'),results=document.getElementById('results');
const accessible=new Set(['C2','C3','C4','C7','C8','C9','C10']);
const y={I:185,H:245,G:305,F:365,E:425,D:486,C:548,B:669,A:729};
const aisleY={I:150,H:215,G:275,F:335,E:395,D:455,C:515,B:635,A:700};
const specs={I:[[1,7,46],[9,12,465]],H:[[1,7,46],[8,15,418]],G:[[1,7,46],[8,15,418]],F:[[3,7,140],[8,15,418]],E:[[3,7,140],[8,15,418]],D:[[1,7,46],[8,11,418]],C:[[1,3,46],[4,6,232],[7,10,418]],B:[[1,9,186]],A:[[1,10,93]]};
const seatPos=new Map();Object.entries(specs).forEach(([row,groups])=>groups.forEach(([start,end,x0])=>{for(let n=start;n<=end;n++)seatPos.set(row+n,{x:x0+(n-start)*47,y:y[row],row})}));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localTime(value){if(!value)return 'Showtime unavailable';return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}
function showingAlert(value,runtimeMinutes){
 if(!value)return '';
 const show=new Date(value),now=new Date(),minutes=Math.round((show-now)/60000),runtime=Number(runtimeMinutes||0),end=new Date(show.getTime()+runtime*60000);
 if(runtime>0&&now>end){
  const startText=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(show);
  const endText=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(end);
  return `<div class="past-alert" role="alert"><strong>This showing has ended</strong><span>Started ${esc(startText)} · Estimated end ${esc(endText)}</span><span>Please see a manager for help.</span></div>`;
 }
 if(minutes<=30)return '';
 const sameDate=show.getFullYear()===now.getFullYear()&&show.getMonth()===now.getMonth()&&show.getDate()===now.getDate();
 const dateText=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(show);
 const timeText=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(show);
 if(!sameDate)return `<div class="future-alert" role="alert"><strong>This ticket is not for today</strong><span>Scheduled for ${esc(dateText)} at ${esc(timeText)}</span><span>Please see a manager for help.</span></div>`;
 const hours=Math.floor(minutes/60),remaining=minutes%60,until=hours?`${hours} hr${hours===1?'':'s'}${remaining?' '+remaining+' min':''}`:`${remaining} min`;
 return `<div class="future-alert" role="alert"><strong>This showing starts later</strong><span>Scheduled for ${esc(timeText)} — approximately ${esc(until)} from now</span><span>Please see a manager for help.</span></div>`;
}
function routeFor(label){const p=seatPos.get(label);if(!p)return '';const r=p.row;if(r==='A')return `M45 748 L45 620 L120 620 L120 700 L${Math.max(120,p.x)} 700`;if(r==='B')return `M45 748 L45 620 L120 620 L120 635 L${p.x} 635`;return `M45 748 L45 620 L374 620 L374 ${aisleY[r]} L${p.x} ${aisleY[r]}`}
function mapSvg(selected){
 const selectedSet=new Set(selected),routes=[...selectedSet].map(routeFor).filter(Boolean).map(d=>`<path class="route" pathLength="1" d="${d}"/>`).join('');let seats='';
 specs&&Object.entries(specs).forEach(([row,groups])=>groups.forEach(([start,end,x0])=>{for(let n=start;n<=end;n++){const label=row+n,x=x0+(n-start)*47,cls=`seat-group${selectedSet.has(label)?' selected':''}${accessible.has(label)?' access':''}`;seats+=`<g class="${cls}"><rect class="seat" x="${x-18}" y="${y[row]-15}" width="36" height="30" rx="9"/><text class="seat-label" x="${x}" y="${y[row]+1}" text-anchor="middle" dominant-baseline="middle">${label}</text></g>`}}));
 return `<svg viewBox="0 0 792 760" role="img" aria-label="Auditorium 9 map showing routes to seats ${esc(selected.join(', '))}"><path class="screen" d="M80 48 Q396 -10 708 48 L604 81 Q396 40 180 81 Z"/><text class="screen-label" x="396" y="50" text-anchor="middle">SCREEN</text>${routes}${seats}<circle class="entry" cx="45" cy="748" r="9"/><text class="entry-label" x="64" y="748" dominant-baseline="middle">ENTRY</text></svg>`;
}
function renderShowing(showing){const canMap=Number(showing.screen_id)===2077;return `<section class="result">${showingAlert(showing.showtime_utc,showing.runtime_minutes)}<div class="details"><div><div class="title">${esc(showing.title||'Showing')}</div><div class="meta">${esc(showing.auditorium||'Auditorium')} · ${esc(localTime(showing.showtime_utc))}</div></div><div><div class="meta">Your seats</div><div class="seats">${esc(showing.seats.join(', '))}</div></div></div>${canMap?mapSvg(showing.seats):'<div class="unsupported">A seat map has not been configured for this auditorium yet.</div>'}</section>`}
form.addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();results.innerHTML='';message.textContent='';if(!/^\d+$/.test(value)){message.textContent='Enter a numeric order number.';input.select();return}try{const response=await fetch('/api/order/'+encodeURIComponent(value),{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Lookup failed.');results.innerHTML=data.showings.map(renderShowing).join('');requestAnimationFrame(()=>results.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}))}catch(error){message.textContent=error.message}finally{input.focus();input.select()}});
</script>
</body>
</html>
